name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Pack
        run: npm pack
      - name: Publish to npm (skipped until the NPM_TOKEN secret exists)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Note when npm publish was skipped
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN not set; npm publish skipped. Publish locally with npm publish."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
